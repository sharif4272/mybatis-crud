<!-- index.html - Home page -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Batis Crud</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>User Management System</h1>

    <!-- Success Message -->
    <div th:if="${success}" class="alert success">
        <p th:text="${success}"></p>
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="alert error">
        <p th:text="${error}"></p>
    </div>

    <div class="actions">
        <a th:href="@{/users/add}" class="btn btn-primary">Add New User</a>
    </div>

    <table class="user-table">
        <thead>
        <tr>
            <th>SL No.</th>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user, index : ${users}">
            <td th:text="${index.index + 1}"></td>
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.phone}"></td>
            <td th:text="${user.address}"></td>
            <td>
                <a th:href="@{'/users/edit/' + ${user.id}}"
                   class="btn-edit">Edit</a>
                <a th:href="@{'/users/delete/' + ${user.id}}"
                   class="btn-delete"
                   onclick="return confirm('Are you Confirm?')">Delete</a>
            </td>
        </tr>
        <tr th:if="${users.empty}">
            <td colspan="6" class="no-data">No User Found!</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
